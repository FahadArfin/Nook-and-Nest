name: Validate and package

on:
  pull_request:
    branches: [master]
  push:
    branches: [beta1, master, codex/feature-optimization, codex/natural-meadow, codex/repo-maintenance, codex/vegetation-crash, codex/vegetation-millions, codex/beta-ux, codex/beta-controls, codex/beta-editor-cleanup, codex/beta-compact-actions, codex/beta-studio-toolbar, codex/beta-floor-tabs-refinement, codex/beta-luna-pipeline, codex/beta-living-home]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: Asset pipeline references
        run: npm run assets:verify
      - name: Type check
        run: npm run check
      - name: Application tests
        run: npm test -- --maxWorkers=2
      - name: Model integrity and lossless compression tests
        run: npm run test:assets
      - name: Production build
        run: npm run build
      - name: Hosting tests
        run: npm run test:sites && node --test tests/library-assets.test.mjs
      - name: Release integrity and size limits
        run: node scripts/verify-release.mjs
      - name: Package and verify exact build
        run: python3 scripts/package-ci-release.py
      - name: Retain validated master or isolated Beta 2 release
        if: (github.ref == 'refs/heads/beta1' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/codex/feature-optimization' || github.ref == 'refs/heads/codex/natural-meadow' || github.ref == 'refs/heads/codex/repo-maintenance' || github.ref == 'refs/heads/codex/vegetation-crash' || github.ref == 'refs/heads/codex/vegetation-millions' || github.ref == 'refs/heads/codex/beta-ux' || github.ref == 'refs/heads/codex/beta-controls' || github.ref == 'refs/heads/codex/beta-editor-cleanup' || github.ref == 'refs/heads/codex/beta-compact-actions' || github.ref == 'refs/heads/codex/beta-studio-toolbar' || github.ref == 'refs/heads/codex/beta-floor-tabs-refinement' || github.ref == 'refs/heads/codex/beta-luna-pipeline' || github.ref == 'refs/heads/codex/beta-living-home') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sites-release-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

